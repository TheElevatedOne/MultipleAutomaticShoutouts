# MultipleAutomaticShoutouts config. Read once when the game starts; restart the game after a change.

# How many pages of automatic shoutouts to keep, from 1 to 20. Each page holds one text and switch
# per situation. When a situation comes up, one of the pages that have it turned on is sent at
# random. With 1 page the game behaves as without the plugin, and the menu's hint is greyed out.
Pages = 5

# The key that turns the page the game's Automatic Shoutouts menu shows and edits, also while the
# menu is open. It works while the game window has focus. Names: F1 to F24, Insert, PageUp,
# PageDown, or a virtual-key code such as "0x76". Keys the menu already uses (Esc, N, R, C, Q, E, F,
# WASD, the arrows, Enter, Space) and keys that type text are refused.
SwitchKey = "F7"

# The controller button that does the same, but only while the Shoutouts menu is open on its Auto
# tab, so it doesn't get in the way of the button's own use in the game. The menu's button guide
# shows it with the game's own icon. Names (Xbox): RightStick (R3), LeftStick (L3), Back (View;
# Create or Share on PlayStation, Minus on Nintendo), or None to turn it off. The other buttons
# already do something in the menu.
ControllerButton = "RightStick"

# The text after the button in the menu's button guide. The page shown and the number of pages
# follow it, as in "Cycle Through Pages (1/2)".
GuideText = "Cycle Through Pages"

# Only for ControllerButton = "None", whose hint is text after "Auto-translation On/Off":
# whether it gets a line of its own. With false it follows that text on the same line. The stick
# buttons get an entry of their own, which the game lays out itself.
HintOnOwnLine = true
